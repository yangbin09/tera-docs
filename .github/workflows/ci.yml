name: Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    name: Code Quality Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs
        run: npm run validate:docs

      - name: Build test
        run: npm run docs:build

      - name: Check build output
        run: |
          test -d ".vitepress/dist"
          echo "Build successful: dist directory exists"

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List top-level dependencies
        run: npm ls --depth=0
