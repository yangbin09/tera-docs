name: Deploy VitePress site to Remote Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs
        run: npm run validate:docs

      - name: Build with VitePress
        run: |
          npm run docs:build
          touch .vitepress/dist/.nojekyll

      - name: Validate deployment settings
        env:
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_WEB_DIR: ${{ secrets.REMOTE_WEB_DIR }}
          REMOTE_BACKUP_DIR: ${{ secrets.REMOTE_BACKUP_DIR }}
        run: |
          set -euo pipefail
          for name in SSH_HOSTNAME SSH_USERNAME SSH_PORT REMOTE_WEB_DIR REMOTE_BACKUP_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          case "$REMOTE_WEB_DIR" in
            "/"|"."|".."|"")
              echo "Refusing unsafe REMOTE_WEB_DIR: $REMOTE_WEB_DIR"
              exit 1
              ;;
          esac

      - name: Prepare remote upload directory
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_WEB_DIR: ${{ secrets.REMOTE_WEB_DIR }}
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          envs: REMOTE_WEB_DIR
          script: |
            set -e

            if [ -z "$REMOTE_WEB_DIR" ] || [ "$REMOTE_WEB_DIR" = "/" ]; then
              echo "Refusing unsafe REMOTE_WEB_DIR: $REMOTE_WEB_DIR"
              exit 1
            fi

            upload_dir="${REMOTE_WEB_DIR}.__upload"
            rm -rf "$upload_dir"
            mkdir -p "$upload_dir"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: ".vitepress/dist/*"
          target: ${{ secrets.REMOTE_WEB_DIR }}.__upload/
          strip_components: 2
          overwrite: true

      - name: Finalize remote deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          REMOTE_WEB_DIR: ${{ secrets.REMOTE_WEB_DIR }}
          REMOTE_BACKUP_DIR: ${{ secrets.REMOTE_BACKUP_DIR }}
          ENABLE_GZIP: ${{ secrets.ENABLE_GZIP }}
        with:
          host: ${{ secrets.SSH_HOSTNAME }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          envs: REMOTE_WEB_DIR,REMOTE_BACKUP_DIR,ENABLE_GZIP
          script: |
            set -e

            if [ -z "$REMOTE_WEB_DIR" ] || [ "$REMOTE_WEB_DIR" = "/" ]; then
              echo "Refusing unsafe REMOTE_WEB_DIR: $REMOTE_WEB_DIR"
              exit 1
            fi

            if [ -z "$REMOTE_BACKUP_DIR" ] || [ "$REMOTE_BACKUP_DIR" = "/" ]; then
              echo "Refusing unsafe REMOTE_BACKUP_DIR: $REMOTE_BACKUP_DIR"
              exit 1
            fi

            upload_dir="${REMOTE_WEB_DIR}.__upload"
            if [ ! -d "$upload_dir" ]; then
              echo "Upload directory does not exist: $upload_dir"
              exit 1
            fi

            timestamp="$(date +%Y%m%d_%H%M%S)"
            backup_dir="$REMOTE_BACKUP_DIR/$timestamp"
            mkdir -p "$REMOTE_BACKUP_DIR"

            if [ -d "$REMOTE_WEB_DIR" ]; then
              mkdir -p "$backup_dir"
              cp -a "$REMOTE_WEB_DIR"/. "$backup_dir"/
              rm -rf "$REMOTE_WEB_DIR"
            fi

            mv "$upload_dir" "$REMOTE_WEB_DIR"
            find "$REMOTE_BACKUP_DIR" -mindepth 1 -maxdepth 1 -type d | sort -r | tail -n +4 | xargs -r rm -rf

            chown -R www-data:www-data "$REMOTE_WEB_DIR"
            chmod -R 755 "$REMOTE_WEB_DIR"

            if [ "$ENABLE_GZIP" = "true" ]; then
              find "$REMOTE_WEB_DIR" -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" \) -exec gzip -kf {} \;
            fi

            nginx -t
            nginx -s reload

            echo "Deployment finished at: $(date)"
